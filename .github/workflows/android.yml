name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Project Dependencies
        run: npm install

      - name: Compile Production Web Assets
        run: npm run build

      - name: Setup Java Development Kit (JDK 21)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Sync Web Assets to Android Project
        run: npx cap sync android

      - name: Compile Native Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Installer APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zeta-calculator-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
